<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agua Ya - Pedido</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #e3f2fd;
    color: #0d47a1;
  }
  header {
    background-color: #1565c0;
    color: white;
    padding: 15px 10px;
    text-align: center;
    font-weight: bold;
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  header img {
    width: 28px;
    height: 28px;
    margin-right: 10px;
  }
  main {
    padding: 15px;
  }
  label, input, select, button {
    display: block;
    width: 100%;
    font-size: 1rem;
    margin-bottom: 15px;
  }
  input, select {
    padding: 10px;
    border-radius: 6px;
    border: 1.5px solid #90caf9;
  }
  button {
    background-color: #0d47a1;
    color: white;
    border: none;
    padding: 10px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
  }
  #iconRepartidor {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #0d47a1;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    box-shadow: 0 0 10px #0d47a1aa;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
  #modalRepartidor {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  #modalRepartidor.active {
    display: flex;
  }
  #modalRepartidor .modal-content {
    background: white;
    padding: 20px 25px;
    border-radius: 10px;
    width: 90%;
    max-width: 320px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    text-align: center;
  }
  #modalSuccess {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  #modalSuccess.active {
    display: flex;
  }
  .success-box {
    background-color: #2196f3;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
    color: white;
    font-size: 1.3rem;
    position: relative;
  }
  .success-box .circle {
    background-color: #4caf50;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: white;
  }
  .confetti {
    position: absolute;
    width: 6px;
    height: 16px;
    background-color: #fff;
    animation: fall 1s linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0); }
    100% { transform: translateY(600px) rotate(360deg); }
  }
</style>
</head>
<body>

<header>
  <img src="https://cdn-icons-png.flaticon.com/512/2933/2933601.png" alt="Icono Agua" />
  Agua Ya
</header>

<main>
  <form id="pedidoForm">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" placeholder="Tu nombre" required />
    <label for="direccion">Dirección:</label>
    <input type="text" id="direccion" placeholder="Tu dirección" required />
    <label for="cantidad">Cantidad de botellas:</label>
    <select id="cantidad" required>
      <option value="" disabled selected>Selecciona cantidad</option>
      <option value="1">1 botella</option>
      <option value="2">2 botellas</option>
      <option value="3">3 botellas</option>
      <option value="4">4 botellas</option>
      <option value="5">5 botellas</option>
    </select>
    <button type="submit">Realizar Pedido</button>
  </form>
</main>

<div id="iconRepartidor" title="Área Repartidor">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <path d="M5 16c-1.1 0-2 .9-2 2s.9 2 2 2c.92 0 1.68-.62 1.93-1.47h5.14l2.44 2.44 1.41-1.41-2.44-2.44v-5.14c.85-.25 1.47-1.01 1.47-1.93 0-1.1-.9-2-2-2s-2 .9-2 2c0 .41.16.79.44 1.07l-1.07 1.07h-2.41l-1.07-1.07c.28-.28.44-.66.44-1.07 0-1.1-.9-2-2-2zM3 6h18v2H3z"/>
  </svg>
</div>

<div id="modalRepartidor">
  <div class="modal-content">
    <h2>Acceso Repartidor</h2>
    <input type="password" id="passwordRepartidor" placeholder="Contraseña" />
    <button id="btnEntrarRepartidor">Entrar</button>
    <p id="errorPass" style="color:red;display:none">Contraseña incorrecta</p>
  </div>
</div>

<div id="modalSuccess">
  <div class="success-box">
    <div class="circle">✔</div>
    ¡Pedido realizado con éxito!
  </div>
</div>

<script>
const form = document.getElementById('pedidoForm');
const modalSuccess = document.getElementById('modalSuccess');

form.addEventListener('submit', e => {
  e.preventDefault();

  const nombre = form.nombre.value.trim();
  const direccion = form.direccion.value.trim();
  const cantidad = form.cantidad.value;

  if (!nombre || !direccion || !cantidad) return;

  const pedidos = JSON.parse(localStorage.getItem('pedidos') || '[]');
  pedidos.push({ id: Date.now(), nombre, direccion, cantidad, entregado: false });
  localStorage.setItem('pedidos', JSON.stringify(pedidos));
  form.reset();

  modalSuccess.classList.add('active');
  for (let i = 0; i < 100; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + 'vw';
    confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
    confetti.style.animationDuration = (Math.random() + 0.5) + 's';
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 2000);
  }
  setTimeout(() => {
    modalSuccess.classList.remove('active');
  }, 3000);
});

document.getElementById('iconRepartidor').addEventListener('click', () => {
  document.getElementById('modalRepartidor').classList.add('active');
});

document.getElementById('btnEntrarRepartidor').addEventListener('click', () => {
  const input = document.getElementById('passwordRepartidor');
  const pass = input.value;
  if (pass === '12345') {
    window.location.href = 'repartidor.html';
  } else {
    document.getElementById('errorPass').style.display = 'block';
  }
});
</script>

</body>
</html>
